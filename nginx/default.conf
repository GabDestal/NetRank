# Reverse proxy in front of the API. The API container publishes no port; nginx is the only entry point.

upstream netrank_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;

    # Probe used by the compose healthcheck; never reaches the API.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://netrank_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # GDS refresh and agent answers can take a while.
        proxy_read_timeout 120s;
    }
}
