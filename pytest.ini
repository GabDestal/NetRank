[pytest]
testpaths = tests
addopts = -ra
markers =
    integration: needs a live Neo4j (skipped when unreachable)
    container: needs the running docker compose stack (skipped when down)
filterwarnings =
    error::DeprecationWarning:app.*
    # Starlette 1.9 prefers httpx2 for TestClient; httpx 0.28 still works. Revisit when bumping deps.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
