name: Docker

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/gabdestal/netrank-api

jobs:
  stack:
    name: Compose stack health
    runs-on: ubuntu-latest
    env:
      NETRANK_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create .env from the example
        run: |
          cp .env.example .env
          sed -i "s/^NEO4J_PASSWORD=.*/NEO4J_PASSWORD=ci${{ github.run_id }}/" .env
      - name: Start neo4j, api, nginx and wait for healthy
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: make install
      - name: Container health tests
        run: make test-stack
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Push API image to GHCR
    needs: stack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
