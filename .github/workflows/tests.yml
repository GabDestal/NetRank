name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # coverage action pushes badge data to its own branch (main only)
      pull-requests: write  # coverage action comments on PRs
    env:
      # Throwaway credentials for the ephemeral service container; nothing secret is committed.
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: ci${{ github.run_id }}
      NETRANK_REQUIRE_SERVICES: "1"
    services:
      neo4j:
        image: neo4j:5.26.32
        env:
          NEO4J_AUTH: neo4j/ci${{ github.run_id }}
          NEO4J_PLUGINS: '["graph-data-science"]'
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci${{ github.run_id }} 'RETURN gds.version()'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: make install
      - name: Unit + Neo4j integration tests with coverage (container tests run in the Docker workflow)
        run: .venv/bin/python -m pytest --ignore=tests/container --cov --cov-report=term-missing --cov-fail-under=60
      - name: Coverage comment and badge
        uses: py-cov-action/python-coverage-comment-action@v4
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60
